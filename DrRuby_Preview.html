<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrRuby.ai — Landing Pages Preview</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #f0f0f0;
  -webkit-font-smoothing: antialiased;
}

/* TOP BAR */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: #1a1a1a; height: 52px;
  display: flex; align-items: center; gap: 0;
  border-bottom: 3px solid #d0021b;
}
.topbar-logo {
  font-size: 16px; font-weight: 700; color: white;
  padding: 0 24px; letter-spacing: -0.3px; flex-shrink: 0;
}
.topbar-logo span { color: #d0021b; }
.tabs {
  display: flex; height: 100%; gap: 0;
}
.tab {
  padding: 0 28px; font-size: 13px; font-weight: 500;
  color: rgba(255,255,255,0.45); cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 3px solid transparent;
  transition: all 0.15s; margin-bottom: -3px;
  border: none; background: none;
}
.tab:hover { color: rgba(255,255,255,0.75); }
.tab.active { color: white; border-bottom: 3px solid #d0021b; }
.tab-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: rgba(255,255,255,0.2);
}
.tab.active .tab-dot { background: #d0021b; }

.topbar-right {
  margin-left: auto; padding: 0 20px;
  font-size: 12px; color: rgba(255,255,255,0.25);
}

/* FRAME WRAPPER */
.frame-wrapper {
  margin-top: 52px;
  position: relative;
}
.frame {
  display: none;
  width: 100%; height: calc(100vh - 52px);
  border: none;
}
.frame.active { display: block; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">Dr<span>Ruby</span>.ai</div>
  <div class="tabs">
    <button class="tab active" onclick="showTab(0)">
      <span class="tab-dot"></span> Main Page
    </button>
    <button class="tab" onclick="showTab(1)">
      <span class="tab-dot"></span> Skin Path
    </button>
    <button class="tab" onclick="showTab(2)">
      <span class="tab-dot"></span> Healthspan Path
    </button>
  </div>
  <div class="topbar-right">Landing Pages Preview</div>
</div>

<div class="frame-wrapper">
  <iframe class="frame active" src="index.html"></iframe>
  <iframe class="frame" src="skin.html"></iframe>
  <iframe class="frame" src="healthspan.html"></iframe>
</div>

<script>
function showTab(i) {
  document.querySelectorAll('.tab').forEach((t, idx) => t.classList.toggle('active', idx === i));
  document.querySelectorAll('.frame').forEach((f, idx) => f.classList.toggle('active', idx === i));
}
</script>

</body>
</html>
